plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minimal.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.minimal.tvlauncher"
        minSdk 22
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
